# Cloud Run 서비스 선언 (GitOps 소스 오브 트루스)
#
# - 프로젝트: mobile-invitation-prod / 서비스: mobile-invitation / 리전: asia-northeast3
# - 이 파일을 수정해 커밋하면 CI(.github/workflows/deploy-cloud-run.yml)가
#   `gcloud run services replace` 로 그대로 반영한다.
# - image 의 `IMAGE_PLACEHOLDER` 는 CI가 커밋 SHA 태그로 치환한다. 직접 수정하지 말 것.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mobile-invitation
  labels:
    app: mobile-invitation
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        # 콜드 스타트 시 SSR 부팅을 빠르게
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: IMAGE_PLACEHOLDER
          ports:
            - name: http1
              containerPort: 8080
          env:
            # Angular 22 SSR Host 헤더 검증(SSRF 방지). 미설정 시 400.
            # Cloudflare Worker 프록시(cloudflare/) 경유 + run.app 직접 접속 허용.
            - name: NG_ALLOWED_HOSTS
              value: "invitation.ran-kun.com,mobile-invitation-432429670565.asia-northeast3.run.app"
            # Cloud Run 프록시 뒤이므로 X-Forwarded-Host 신뢰
            - name: NG_TRUST_PROXY_HEADERS
              value: "1"
            # 비공개 admin-backend (SSR가 ID 토큰을 붙여 서비스 간 인증 호출)
            - name: BACKEND_API_BASE_URL
              value: "https://admin-backend-pfppe2wxla-du.a.run.app"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 3
            failureThreshold: 10
