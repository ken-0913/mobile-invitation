# main 푸시 → 컨테이너 빌드/푸시 → cloudrun/service.yaml 적용 (GitOps)
#
# 사전 준비(1회):
#   1. Artifact Registry 저장소 생성:
#        gcloud artifacts repositories create cloud-run \
#          --project=mobile-invitation-prod --location=asia-northeast3 \
#          --repository-format=docker
#   2. Workload Identity Federation 설정 후 GitHub Secrets 등록:
#        GCP_WIF_PROVIDER      — projects/{number}/locations/global/workloadIdentityPools/{pool}/providers/{provider}
#        GCP_SERVICE_ACCOUNT   — 배포용 SA 이메일 (roles/run.admin,
#                                roles/artifactregistry.writer, roles/iam.serviceAccountUser)
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: mobile-invitation-prod
  REGION: asia-northeast3
  SERVICE: mobile-invitation
  IMAGE: asia-northeast3-docker.pkg.dev/mobile-invitation-prod/cloud-run/mobile-invitation

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation 용

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Render service manifest
        run: |
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}:${GITHUB_SHA}|" \
            cloudrun/service.yaml > /tmp/service.rendered.yaml

      - name: Deploy (gcloud run services replace)
        run: |
          gcloud run services replace /tmp/service.rendered.yaml \
            --region "${REGION}" \
            --project "${PROJECT_ID}"

      - name: Allow unauthenticated access
        run: |
          gcloud run services add-iam-policy-binding "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
