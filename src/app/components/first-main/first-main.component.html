<div class="wedding-main">
  <div class="wedding-main-box">
    <p class="cover-title">{{ coverTitle }}</p>
    <p class="names">{{ namesEn }}</p>
    <div class="wedding-image-box">
      <img class="wedding-image" [src]="coverImage" alt="wedding cover">
    </div>
    <div class="wedding-meta">
      <p>{{ dateText }}</p>
      <p>{{ timeText }}</p>
      <p>{{ venueText }}</p>
    </div>
  </div>
</div>
